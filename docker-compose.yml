services:
  postgres:
    image: postgres:17
    container_name: imaginaso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imaginaso
      POSTGRES_PASSWORD: imaginaso_dev_pw
      POSTGRES_DB: imaginaso_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: